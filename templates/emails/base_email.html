<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>{% block subject %}Leyyow{% endblock %}</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!--[if mso]>
  <noscript>
    <xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml>
  </noscript>
  <![endif]-->
  <style>
    /* Reset */
    body, table, td, p, a, li, blockquote { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
    img { -ms-interpolation-mode: bicubic; border: 0; outline: none; text-decoration: none; }
    body { margin: 0; padding: 0; background-color: #F5F0E8; }
    a { color: #DF7B00; }
    a:hover { color: #FEAA00; }
  </style>
</head>
<body style="margin:0;padding:0;background-color:#F5F0E8;font-family:'Outfit',Arial,sans-serif;">

  <!-- Outer wrapper -->
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
         style="background-color:#F5F0E8;padding:32px 16px;">
    <tr>
      <td align="center">

        <!-- Email card: max 600px -->
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
               style="max-width:600px;background-color:#ffffff;border-radius:12px;overflow:hidden;border:1px solid #E8D8C0;">

          <!-- ── HEADER ── -->
          <tr>
            <td style="background-color:#14110E;padding:20px 32px;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="padding-right:10px;vertical-align:middle;">
                    <!-- Logo icon: petal shape in gold on dark bg -->
                    <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                      <tr>
                        <td style="width:32px;height:32px;background-color:#FEAA00;border-radius:9px;text-align:center;vertical-align:middle;">
                          <img src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAiIGhlaWdodD0iMjAiIHZpZXdCb3g9IjAgMCAyMCAyMCIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cGF0aCBkPSJNMTAgMkM3LjUgMiA1LjUgNC4yIDUuNSA3YzAgMi4yIDEuNCA0IDMuMiA0LjhWMTVoMi42di0zLjJjMS44LS44IDMuMi0yLjYgMy4yLTQuOEMxNC41IDQuMiAxMi41IDIgMTAgMnoiIGZpbGw9IiMxNDExMEUiLz48cGF0aCBkPSJNOC41IDE1aDN2MS4yYzAgLjctLjYgMS4zLTEuMyAxLjNoLS40Yy0uNyAwLTEuMy0uNi0xLjMtMS4zVjE1eiIgZmlsbD0iIzE0MTEwRSIvPjwvc3ZnPg=="
                               width="20" height="20" alt="" style="display:block;">
                        </td>
                      </tr>
                    </table>
                  </td>
                  <td style="vertical-align:middle;">
                    <span style="font-family:'Outfit',Arial,sans-serif;font-size:20px;font-weight:700;color:#FEAA00;letter-spacing:-0.02em;">ley</span><span style="font-family:'Outfit',Arial,sans-serif;font-size:20px;font-weight:700;color:#DF7B00;letter-spacing:-0.02em;">yow</span>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- ── HERO (each template provides this block) ── -->
          {% block hero %}{% endblock %}

          <!-- ── BODY (each template provides this block) ── -->
          <tr>
            <td style="padding:28px 32px;">
              {% block body %}{% endblock %}
            </td>
          </tr>

          <!-- ── FOOTER ── -->
          <tr>
            <td style="background-color:#F5F0E8;padding:20px 32px;border-top:1px solid #E8D8C0;">
              <p style="font-family:'Outfit',Arial,sans-serif;font-size:13px;font-weight:600;color:#14110E;margin:0 0 4px;">Leyyow Affiliates</p>
              {% block footer_extra %}{% endblock %}
              <p style="font-family:'Outfit',Arial,sans-serif;font-size:12px;color:#6B6560;margin:6px 0 0;line-height:1.6;">
                © {% now "Y" %} Leyyow ·
                <a href="#" style="color:#DF7B00;text-decoration:none;">Privacy Policy</a> ·
                <a href="#" style="color:#DF7B00;text-decoration:none;">Terms of Use</a>
              </p>
            </td>
          </tr>

        </table>
        <!-- /email card -->

      </td>
    </tr>
  </table>

</body>
</html>
